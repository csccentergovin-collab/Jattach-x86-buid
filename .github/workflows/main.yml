name: Build jattach x86

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup 32-bit compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Get official jattach source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/jattach/jattach.git upstream
          if ($LASTEXITCODE -ne 0) { throw "Source download failed" }

      - name: Build x86 EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cl.exe /O2 /D_CRT_SECURE_NO_WARNINGS /DJATTACH_VERSION=\"2.2\" /Fobuild/jattach.obj /Febuild/jattach.exe upstream/src/windows/jattach.c advapi32.lib /link /SUBSYSTEM:CONSOLE,5.02
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: jattach-x86
          path: build/jattach.exe

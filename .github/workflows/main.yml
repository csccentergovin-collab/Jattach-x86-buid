name: Diagnose jattach x86

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Download official source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/jattach/jattach.git upstream
          if ($LASTEXITCODE -ne 0) {
            throw "Source download failed"
          }

      - name: Diagnose and build
        shell: pwsh
        run: |
          $file = "upstream/src/windows/jattach.c"

          if (!(Test-Path $file)) {
            throw "jattach.c file not found"
          }

          Write-Host "========== SOURCE LINES 259-276 =========="

          $lines = Get-Content $file

          for ($i = 258; $i -lt 276; $i++) {
            Write-Host ("LINE {0}: {1}" -f ($i + 1), $lines[$i])
          }

          Write-Host "========== END SOURCE DIAGNOSTIC =========="

          New-Item -ItemType Directory -Force build | Out-Null

          cl.exe /O2 /D_CRT_SECURE_NO_WARNINGS /Fobuild/jattach.obj /Febuild/jattach.exe $file advapi32.lib /link /SUBSYSTEM:CONSOLE,5.02

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed; see diagnostic lines above"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: jattach-x86
          path: build/jattach.exe

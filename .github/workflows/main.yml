name: Build jattach x86

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Download jattach v2.0
        shell: pwsh
        run: |
          git clone --branch v2.0 --depth 1 https://github.com/jattach/jattach.git upstream
          if ($LASTEXITCODE -ne 0) {
            throw "Source download failed"
          }

      - name: Compile 32-bit EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null

          cl.exe /nologo /O2 /D_CRT_SECURE_NO_WARNINGS /DJATTACH_VERSION=\"2.0\" /Fobuild/jattach.obj /Febuild/jattach.exe upstream/src/windows/jattach.c advapi32.lib /link /SUBSYSTEM:CONSOLE,5.02

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: jattach-x86
          path: build/jattach.exe

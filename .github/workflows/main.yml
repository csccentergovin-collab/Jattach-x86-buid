name: Build jattach x86

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Extract and build
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "jattach-2.2.zip" -DestinationPath "source" -Force

          $src = Get-ChildItem "source" -Recurse -Filter "jattach.c" |
            Where-Object { $_.FullName -match '[\\/]src[\\/]windows[\\/]jattach\.c$' } |
            Select-Object -First 1

          if (-not $src) {
            throw "Windows jattach.c not found"
          }

          New-Item -ItemType Directory -Force -Path "build" | Out-Null

          cl.exe /O2 /D_CRT_SECURE_NO_WARNINGS /DJATTACH_VERSION=\"2.2\" /Fobuild/jattach.obj /Febuild/jattach.exe $src.FullName advapi32.lib /link /SUBSYSTEM:CONSOLE,5.02

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: jattach-x86
          path: build/jattach.exe
